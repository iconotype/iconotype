[package]
name = "iconotype"
version = "0.2.0"
description = "Iconotype — build and manage icon fonts"
authors = ["Iconotype"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "iconotype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
