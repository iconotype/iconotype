name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise. `test` cuts a prerelease (0.3.0-test.1) published to the pre-release channels.'
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, test]

# Nothing is published until everything is built. The jobs below produce artifacts;
# the last one takes them and releases the lot in a single step, so there is never a
# window where the desktop app exists and the extension does not.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cut.outputs.version }}
      release: ${{ steps.cut.outputs.release }}
      tag: ${{ steps.cut.outputs.tag }}
      prerelease: ${{ steps.cut.outputs.prerelease }}
      notes: ${{ steps.cut.outputs.notes }}
      sha: ${{ steps.push.outputs.sha }}
      before: ${{ steps.before.outputs.sha }}
    steps:
      # the changelog is read from the commits since the last tag, and a shallow
      # clone has neither the commits nor the tags
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # writes the version into all five manifests and the changelog entry, and hands
      # the workflow the numbers it needs. See scripts/version.mjs.
      - id: cut
        run: node scripts/version.mjs --bump ${{ inputs.bump }}

      - id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # add, not commit -a: CHANGELOG.md does not exist on the first release and
          # -a stages only files git already knows about
          git add -A
          git commit -qm "chore(release): ${{ steps.cut.outputs.version }}"
          # annotated, not lightweight: --follow-tags ignores lightweight tags, and a
          # tag that stays local fails every job that checks the release out by tag
          git tag -a "${{ steps.cut.outputs.tag }}" -m "${{ steps.cut.outputs.tag }}"
          git push --follow-tags origin "HEAD:$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    # Whether to sign, as a plain boolean at JOB level.
    #
    # A step's `if` cannot see env defined in that same step — the condition is
    # evaluated before the step environment exists — so gating on `env.APPLE_CERTIFICATE`
    # there silently disabled signing for every release. And the gate is a boolean rather
    # than the certificate itself: an APPLE_CERTIFICATE that exists but is empty is worse
    # than none at all, per the note on the step below.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, args: --target aarch64-apple-darwin, name: macos-arm64 }
          - { platform: macos-latest, args: --target x86_64-apple-darwin, name: macos-x64 }
          - { platform: ubuntu-22.04, args: '', name: linux }
          - { platform: windows-latest, args: '', name: windows }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: System libraries (linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}

      # Signing is opt-in, and opting in has to be all-or-nothing.
      #
      # Setting APPLE_CERTIFICATE to an empty string is not the same as leaving it
      # unset: the bundler sees the variable, takes the signing path, and fails with
      # "security import: failed to import keychain certificate". So the variables are
      # written to the environment only when there is a certificate to write.
      - name: Enable code signing
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERT == 'true'
        run: |
          {
            echo "ENABLE_CODE_SIGNING=1"
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      # Updater artifacts are opt-in for the same reason signing is.
      #
      # `createUpdaterArtifacts` lives in its own config overlay rather than in
      # tauri.conf.json: with it on and no signing key, the bundler stops with "private
      # key not found" and takes the whole release with it. Merged in only when there is
      # a key to sign with, so a fork, a local build and a release before the secrets
      # are set all keep working — they simply ship no update manifest.
      - id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && ' --config src-tauri/tauri.updater.conf.json' || '' }}

      # An unsigned build does not fail — it produces an app macOS refuses to open on
      # anyone else's machine, which is only discovered by a stranger downloading it. So
      # the claim is checked here: adhoc means the identity never reached the bundler.
      - name: Verify the signature
        if: startsWith(matrix.platform, 'macos') && env.HAS_APPLE_CERT == 'true'
        run: |
          set -euo pipefail
          app=$(find apps/desktop/src-tauri/target -path '*/release/bundle/macos/*.app' -maxdepth 6 -print -quit)
          [ -n "$app" ] || { echo "no .app was bundled"; exit 1; }
          codesign -dvv "$app" 2>&1 | tee /dev/stderr | grep -q 'Authority=Developer ID Application' || {
            echo "::error::bundle is not signed with a Developer ID — check APPLE_SIGNING_IDENTITY"
            exit 1
          }
          if [ -n "${APPLE_ID:-}" ]; then
            xcrun stapler validate "$app" || {
              echo "::error::notarization ticket missing — the app will be blocked on first launch elsewhere"
              exit 1
            }
          fi

      # to the release only after everything else has built, so they travel as artifacts
      - name: Collect the bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for path in $(echo '${{ steps.build.outputs.artifactPaths }}' | tr -d '[]"' | tr ',' '\n'); do
            [ -e "$path" ] && cp -r "$path" out/ || true
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  extension:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter iconotype-vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: apps/vscode/iconotype.vsix
          if-no-files-found: error

  cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # assembles packages/cli/dist-npm: the bundle plus a manifest npm can take —
      # no workspace: ranges, no private flag, so `npx @iconotype/cli` works
      - run: node packages/cli/publish.mjs ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: packages/cli/dist-npm
          if-no-files-found: error

  publish:
    needs: [version, desktop, extension, cli]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # npm --provenance signs the package against this run; without the OIDC token
      # the publish fails rather than quietly shipping an unattested tarball
      id-token: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - run: find artifacts -type f | sort

      # The update manifest.
      #
      # `tauri-action` can write this itself, but only when it is the thing creating the
      # release — here it builds and hands back paths, and the release is assembled once
      # every platform has finished. So it is assembled from what the bundler signed: a
      # `.sig` next to a bundle means that bundle is an update artifact, which keeps this
      # from knowing whether Tauri wraps an AppImage in a tarball this month.
      - name: Update manifest
        run: |
          set -euo pipefail
          export PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse

          TAG = "${{ needs.version.outputs.tag }}"
          PLATFORMS = {
              "desktop-macos-arm64": "darwin-aarch64",
              "desktop-macos-x64": "darwin-x86_64",
              "desktop-linux": "linux-x86_64",
              "desktop-windows": "windows-x86_64",
          }
          base = f"https://github.com/${{ github.repository }}/releases/download/{TAG}"

          platforms = {}
          for folder, key in PLATFORMS.items():
              for sig in pathlib.Path("artifacts", folder).glob("*.sig"):
                  bundle = sig.with_suffix("")
                  if not bundle.exists():
                      continue
                  platforms[key] = {
                      "signature": sig.read_text().strip(),
                      "url": f"{base}/{urllib.parse.quote(bundle.name)}",
                  }

          if not platforms:
              print("no signed bundles — this release ships without an update manifest")
              raise SystemExit(0)

          pathlib.Path("artifacts/latest.json").write_text(json.dumps({
              "version": TAG.lstrip("v"),
              "notes": "See the release notes.",
              "pub_date": os.environ["PUB_DATE"],
              "platforms": platforms,
          }, indent=2))
          print(json.dumps(platforms, indent=2))
          PY

      # everything at once: the release with every bundle attached, then the two
      # registries. A failure here leaves the tag and the release, which is the right
      # trade — the artifacts exist and can be re-published by hand.
      - name: GitHub release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body: ${{ needs.version.outputs.notes }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          makeLatest: ${{ needs.version.outputs.prerelease == 'false' }}
          artifacts: 'artifacts/desktop-*/*,artifacts/extension/*.vsix,artifacts/latest.json'
          allowUpdates: true

      - name: VSCode marketplace
        if: env.VSCE_PAT != ''
        run: |
          npx --yes @vscode/vsce publish \
            --no-dependencies \
            --packagePath artifacts/extension/iconotype.vsix \
            ${{ needs.version.outputs.prerelease == 'true' && '--pre-release' || '' }}

      # VSCodium, Gitpod, Cursor and the other builds that cannot use Microsoft's
      # marketplace install from Open VSX. Its token comes from a GitHub login, so it
      # is also the one available without an Azure DevOps account at all.
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: |
          npx --yes ovsx publish artifacts/extension/iconotype.vsix \
            --pat "$OVSX_PAT" \
            ${{ needs.version.outputs.prerelease == 'true' && '--pre-release' || '' }}

      - name: npm
        if: env.NPM_TOKEN != ''
        working-directory: artifacts/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --provenance \
            ${{ needs.version.outputs.prerelease == 'true' && '--tag next' || '' }}

  # A build that never finished should not leave a version behind: the release commit
  # and its tag are removed, so the same number can be cut again once it is fixed.
  rollback:
    needs: [version, desktop, extension, cli]
    if: ${{ always() && needs.version.result == 'success' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env:
          TAG: ${{ needs.version.outputs.tag }}
          BEFORE: ${{ needs.version.outputs.before }}
        run: |
          set -euo pipefail
          git push --delete origin "$TAG" || true
          git push --force origin "$BEFORE:$GITHUB_REF_NAME"
