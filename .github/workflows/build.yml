name: build

# Builds the installable things without releasing them, so a change can be tried
# before it is published. Artifacts last 14 days and are attached to the run.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'What to build'
        type: choice
        required: true
        default: all
        options: [all, extension, desktop, web]
      sign:
        description: 'Sign and notarize the macOS build (needs the Apple secrets)'
        type: boolean
        required: false
        default: false
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  extension:
    if: ${{ github.event_name == 'pull_request' || contains(fromJSON('["all","extension"]'), inputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter iconotype-vscode package
      - uses: actions/upload-artifact@v4
        with:
          name: iconotype-vsix
          path: apps/vscode/iconotype.vsix
          retention-days: 14
          if-no-files-found: error

  web:
    if: ${{ github.event_name == 'pull_request' || contains(fromJSON('["all","web"]'), inputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @iconotype/site build
      - run: pnpm --filter @iconotype/web build
      # the same layout Pages serves, so the artifact can be unzipped and opened
      - run: |
          mkdir -p site/app
          cp -r apps/site/dist/. site/
          cp -r apps/web/dist/. site/app/
      - uses: actions/upload-artifact@v4
        with:
          name: iconotype-web
          path: site
          retention-days: 14

  desktop:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","desktop"]'), inputs.targets) }}
    # A step cannot test env it declares itself, so the gate lives at job level. See the
    # same pattern in release.yml, where getting this wrong disabled signing silently.
    env:
      SIGN_MACOS: ${{ inputs.sign && secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, name: macos-arm64 }
          - { platform: ubuntu-22.04, name: linux }
          - { platform: windows-latest, name: windows }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.name }}
      # Unsigned by default: a test build should not need anyone's certificate, and a
      # pull request from a fork cannot read the secrets anyway. Tick "sign" on the run
      # to get something other people's Macs will actually open.
      - name: Enable code signing
        if: startsWith(matrix.platform, 'macos') && env.SIGN_MACOS == 'true'
        run: |
          {
            echo "ENABLE_CODE_SIGNING=1"
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - id: build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop

      - name: Verify the signature
        if: startsWith(matrix.platform, 'macos') && env.SIGN_MACOS == 'true'
        run: |
          set -euo pipefail
          app=$(find apps/desktop/src-tauri/target -path '*/release/bundle/macos/*.app' -maxdepth 6 -print -quit)
          [ -n "$app" ] || { echo "no .app was bundled"; exit 1; }
          codesign -dvv "$app" 2>&1 | tee /dev/stderr | grep -q 'Authority=Developer ID Application' || {
            echo "::error::bundle is not signed with a Developer ID — check APPLE_SIGNING_IDENTITY"
            exit 1
          }
          xcrun stapler validate "$app" || {
            echo "::error::notarization ticket missing — the app will be blocked on first launch elsewhere"
            exit 1
          }
      - name: Collect the bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for path in $(echo '${{ steps.build.outputs.artifactPaths }}' | tr -d '[]"' | tr ',' '\n'); do
            [ -e "$path" ] && cp -r "$path" out/ || true
          done
          # A .app is a tree of symlinks whose signature seals them, and
          # `upload-artifact` re-zips what it is given with a zip that keeps neither
          # symlinks nor extended attributes — so a downloaded .app arrives subtly
          # broken and reports itself unsigned. `ditto` writes the archive Apple's own
          # tools read, and the .dmg beside it was already safe.
          for app in out/*.app; do
            [ -e "$app" ] || continue
            ditto -c -k --keepParent --sequesterRsrc "$app" "${app}.zip"
            rm -rf "$app"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: iconotype-desktop-${{ matrix.name }}
          path: out/*
          retention-days: 14
          if-no-files-found: error
